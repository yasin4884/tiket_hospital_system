services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital_ticket_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_tickets
    volumes:
      - postgres_data:/data

volumes:
  postgres_data:
